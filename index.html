<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zührenaz & Yunus Emre | Yıldönümümüz Kutlu Olsun</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            font-family: 'Poppins', sans-serif;
            color: #2b2b2b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
        }

        /* Müzik Başlatma Overlay */
        #music-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #music-overlay h2 {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #ff4b2b;
            margin-bottom: 15px;
        }

        #music-overlay p {
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        .start-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            color: white;
            padding: 15px 35px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 75, 43, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulse 1.5s infinite;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 75, 43, 0.6);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .container {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.93);
            backdrop-filter: blur(10px);
            border-radius: 25px;
            padding: 40px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            margin-top: 20px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #d63384;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .player-card {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .player-info {
            font-weight: 600;
            color: #d63384;
            font-size: 1.1rem;
        }

        audio {
            width: 100%;
            max-width: 500px;
            height: 45px;
        }

        .counter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .counter-box {
            background: #ffffff;
            padding: 25px 15px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            border: 2px solid #ffe6e6;
        }

        .counter-box h3 {
            color: #d63384;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .timer {
            font-size: 1.3rem;
            font-weight: 600;
